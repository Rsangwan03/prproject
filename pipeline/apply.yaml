trigger:
  branches:
    include:
      - main

pool: self-hosted-pool

variables:
  workingDir: 'modules'                      
  terraformPath: 'C:\Users\SANGWAN\terraform_1.9.5_windows_amd64\terraform.exe'
  terraformPluginCache: '$(System.DefaultWorkingDirectory)\terraform_plugins'  

stages:
- stage: initAndPlan
  displayName: Init and Plan
  jobs:
  - job: terraform
    displayName: Terraform Job
    steps:

    # 1️⃣ Create plugin cache folder
    - powershell: |
        if (!(Test-Path -Path "$(terraformPluginCache)")) {
            New-Item -ItemType Directory -Path "$(terraformPluginCache)" | Out-Null
        }
        Write-Host "Terraform plugin cache: $(terraformPluginCache)"
      displayName: 'Create Terraform plugin cache folder'

    # 2️⃣ Terraform Init using service connection
    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/$(workingDir)'
        backendServiceArm: 'pr-connection'       # Azure Service Connection
        backendAzureRmResourceGroupName: 'pr-store-group'
        backendAzureRmStorageAccountName: 'prstorageaccount01'
        backendAzureRmContainerName: 'statefile'
        backendAzureRmKey: 'pr.statefile'

    # 3️⃣ Terraform Plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/$(workingDir)'
        environmentServiceNameAzureRM: 'pr-connection'

    # 4️⃣ Terraform Apply
    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/$(workingDir)'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'pr-connection'
