trigger: none
 

pool: self-hosted-pool

stages:
- stage: initAndPlan
  displayName: Init and Plan
  jobs:
  - job: terraformInit
    displayName: Initialization
    steps:

    # Step 0: Set Terraform plugin cache to a writable directory
    - powershell: |
        $env:TF_PLUGIN_CACHE_DIR = "C:\TerraformPlugins"
        Write-Host "Terraform plugin cache set to $env:TF_PLUGIN_CACHE_DIR"
      displayName: 'Set Terraform plugin cache'

    # Terraform Init
    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
        backendServiceArm: 'pr-connection'
        backendAzureRmResourceGroupName: 'pr-store-group'
        backendAzureRmStorageAccountName: 'prstorageaccount01'
        backendAzureRmContainerName: 'statefile'
        backendAzureRmKey: 'pr.statefile'

    # Terraform Plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
        environmentServiceNameAzureRM: 'pr-connection'

    # Terraform Apply
    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'pr-connection'
