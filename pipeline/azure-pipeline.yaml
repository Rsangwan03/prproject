stages:
- stage: initAndPlan
  jobs:
  - job: terraform
    pool: self-hosted-pool
    steps:

    # 1️⃣ Azure Login using Service Connection
    - task: AzureCLI@2
      displayName: 'Azure CLI login'
      inputs:
        azureSubscription: 'pr-connection'
        scriptType: 'powershell'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Logged into Azure using service connection"

    # 2️⃣ Create plugin cache folder
    - powershell: |
        if (!(Test-Path -Path "$(System.DefaultWorkingDirectory)\terraform_plugins")) {
            New-Item -ItemType Directory -Path "$(System.DefaultWorkingDirectory)\terraform_plugins" | Out-Null
        }
      displayName: 'Create Terraform plugin cache folder'

    # 3️⃣ Terraform Init
    - powershell: |
        $env:TF_PLUGIN_CACHE_DIR = "$(System.DefaultWorkingDirectory)\terraform_plugins"
        & "C:\Users\SANGWAN\terraform_1.9.5_windows_amd64\terraform.exe" init `
          -backend-config="storage_account_name=prstorageaccount01" `
          -backend-config="container_name=statefile" `
          -backend-config="key=pr.statefile" `
          -backend-config="resource_group_name=pr-store-group"
      workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
      displayName: 'Terraform Init'

    # 4️⃣ Terraform Plan
    - powershell: |
        $env:TF_PLUGIN_CACHE_DIR = "$(System.DefaultWorkingDirectory)\terraform_plugins"
        & "C:\Users\SANGWAN\terraform_1.9.5_windows_amd64\terraform.exe" plan -out=tfplan
      workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
      displayName: 'Terraform Plan'

    # 5️⃣ Terraform Apply
    - powershell: |
        $env:TF_PLUGIN_CACHE_DIR = "$(System.DefaultWorkingDirectory)\terraform_plugins"
        & "C:\Users\SANGWAN\terraform_1.9.5_windows_amd64\terraform.exe" apply -auto-approve tfplan
      workingDirectory: '$(System.DefaultWorkingDirectory)/modules'
      displayName: 'Terraform Apply'
